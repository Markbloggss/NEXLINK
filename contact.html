<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Nexlink</title>
  <style>
    .contact { display: flex; flex-wrap: wrap; gap: 60px; padding: 60px 8%; color: #f8e7c9; }
    .contact-info { flex: 1; min-width: 280px; }
    .contact-info h1 { font-size: 3rem; line-height: 1.1; margin: 0 0 20px; }
    .contact-info p { font-size: 1.2rem; line-height: 1.6; margin: 0 0 20px; }
    .contact-info a { color: #f8e7c9; }

    .contact form { flex: 1; min-width: 280px; display: grid; gap: 18px; }
    .contact label { display: grid; gap: 6px; font-weight: 500; }
    .contact input, .contact select, .contact textarea {
      font: inherit; padding: 12px 14px; border-radius: 10px;
      border: 2px solid #f8e7c9; background: transparent; color: #f8e7c9;
    }
    .contact select option { color: #163a2c; }
    .contact textarea { min-height: 140px; resize: vertical; }
    .contact input:focus, .contact select:focus, .contact textarea:focus {
      outline: 3px solid #7A9A80; outline-offset: 2px;
    }
    .contact button {
      justify-self: start; font: inherit; font-weight: 500;
      font-size: 1.2rem; padding: 1rem 2.5rem; border-radius: 10px;
      border: none; background: #f8e7c9; color: #163a2c; cursor: pointer;
    }
  </style>
</head>

<body style="background-color: #163a2c;">

  <!-- Your existing header goes here -->
  <
  <main class="contact">
    <div class="contact-info">
      <h1>Tell us what you need help with.</h1>
      <p>Send us a few details and we will reply within one working day. Your first call is free.</p>
      <p>Email: <a href="mailto:hello@nexlink.com">hello@nexlink.com</a></p>
      <p>Phone: <a href="tel:+0000000000">+00 000 000 0000</a></p>
    </div>

    <form action="#" method="post">
      <label>Your name
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Phone (optional)
        <input type="tel" name="phone">
      </label>
      <label>What do you need?
        <select name="service">
          <option>IT strategy</option>
          <option>Cloud and migration</option>
          <option>Cybersecurity</option>
          <option>Systems integration</option>
          <option>Managed support</option>
          <option>Something else</option>
        </select>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">SEND MESSAGE</button>
    </form>
  </main>

</body>
</html>
